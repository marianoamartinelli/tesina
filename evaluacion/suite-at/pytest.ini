[pytest]
# Suite de tests de aceptación black-box (H5). Correr desde este directorio:
#   ../../.venv/bin/python -m pytest
testpaths = tests test_smoke.py
markers =
    at(*at_ids): declara los AT-id de la spec que este test verifica (uno o varios)
# Los tests contra el SUT saltan solos si EXCHANGE_API_URL/EXCHANGE_WS_URL no están.
addopts = -ra
