# ATs de épicas 01–09 que NO son automatizables black-box contra el contrato
# HTTP/WebSocket de la épica 09.
#
# Formato (lista YAML; ver HELPERS.md §"Declarar un AT no automatizable"):
#   - at_id: AT-EE-SS-NN        # ID estable del catálogo (tipo backend)
#     motivo: >-                 # por qué no es observable black-box y cómo se
#       ...                      # evalúa en su lugar (rúbrica/manual/white-box)
#     referencia: spec/...       # (opcional) archivo de la HU
#
# Reglas:
# - Un AT declarado acá NO puede tener tests con @pytest.mark.at (el plugin lo
#   rechaza en la colección): o se testea, o se declara, nunca ambas.
# - El reporte (resultados-at.csv) los marca `no_automatizado` y los lista aparte.
# - La carga de la prueba es alta: si el efecto es observable por REST/WS aunque
#   sea indirectamente (p. ej. persistencia vía reinicio del SUT orquestado por el
#   evaluador), se prefiere automatizarlo. Esta lista es para lo genuinamente
#   inobservable desde afuera.
#
# Las entradas siguientes son las declaradas al construir el núcleo del harness;
# los agentes que escriban los tests por épica agregan las suyas con el mismo
# formato y justificación.

- at_id: AT-06-01-01
  motivo: >-
    La generación del seed HD (mnemonic de 24 palabras, checksum BIP-39, seed
    PBKDF2 de 64 bytes, cifrado en reposo) es interna: la API de la épica 09 no
    expone el mnemonic ni el seed por ningún endpoint (custodia, HU-06-01 RN-5).
    Se evalúa por inspección de código/white-box en H8 (rúbrica on-chain).
  referencia: spec/06-wallet-hd-y-direcciones/HU-06-01-generacion-y-custodia-del-seed.md

- at_id: AT-06-01-02
  motivo: >-
    Known-answer test de la derivación BIP-39 (mnemonic canónico + passphrase
    "TREZOR" ⇒ seed hexadecimal exacta): requiere invocar la función interna de
    derivación con inputs elegidos; el contrato HTTP/WS no expone esa operación.
    Se evalúa white-box (tests propios del SUT o inspección) en H8.
  referencia: spec/06-wallet-hd-y-direcciones/HU-06-01-generacion-y-custodia-del-seed.md

- at_id: AT-06-01-12
  motivo: >-
    Atomicidad ante crash durante la escritura del seed: exige inyectar una
    falla de proceso/filesystem en un punto interno del SUT, sin superficie
    black-box para provocarla ni observarla determinísticamente. Se evalúa por
    inspección de código (escritura atómica) en H8.
  referencia: spec/06-wallet-hd-y-direcciones/HU-06-01-generacion-y-custodia-del-seed.md

# --- Épica 01 (fusionado desde no_automatizables_ep01.yaml) ---
- at_id: AT-01-02-13
  motivo: >-
    El log de auditoría de autenticación (RNE-9) es interno por definición: la
    propia HU declara que "no es accesible desde la API del usuario final" y
    que el AT es "verificable por inspección interna; no observable por caja
    negra en la respuesta de la API". No existe superficie HTTP/WS/on-chain
    que lo exponga (exponerlo violaría RNE-3). Se evalúa por inspección de
    código/operativa en H8.
  referencia: spec/01-cuentas-y-autenticacion/HU-01-02-inicio-de-sesion.md

- at_id: AT-01-03-04
  motivo: >-
    El Dado exige un token expirado por TTL. El entorno de evaluación fija el
    TTL en 3600 s (evaluacion/suite-at/entorno/README.md: "TTL de token
    3600 s... se dejan en esos valores") y la spec no da ninguna vía black-box
    para acortarlo ni para adelantar el reloj del SUT: provocar la expiración
    costaría 1 h de espera por corrida. La indistinguibilidad de la respuesta
    401 sí está cubierta para la causa "invalidado por logout" (AT-01-03-02,
    AT-01-04-04). Se evalúa en H8 por inspección de código (chequeo
    t >= expiresAt y validación del TTL al arranque, HU-01-02 RN-3).
  referencia: spec/01-cuentas-y-autenticacion/HU-01-03-cierre-y-expiracion-de-sesion.md

- at_id: AT-01-03-09
  motivo: >-
    Mismo impedimento que AT-01-03-04: el Dado requiere un token ya expirado
    por TTL (3600 s fijos en el entorno de evaluación) y no hay superficie
    black-box para provocar la expiración en tiempo de test. La cláusula "solo
    un nuevo login permite obtener un token válido" está cubierta en su parte
    observable por AT-01-02-01/AT-01-02-03 (el login emite token utilizable);
    la no-reactivación del token expirado se evalúa por inspección de código
    en H8 (HU-01-03 RN-7).
  referencia: spec/01-cuentas-y-autenticacion/HU-01-03-cierre-y-expiracion-de-sesion.md

# --- Épica 02 (fusionado desde no_automatizables_ep02.yaml) ---
- at_id: AT-02-03-01
  motivo: >-
    La estructura del asiento DEPOSIT (type, reference {txHash, logIndex},
    postings CREDIT available / DEBIT EXTERNAL, balanceo por activo) no es
    observable: el contrato de la épica 09 no expone el ledger (el historial de
    HU-02-05 no tiene endpoint en HU-09-01) y EXTERNAL es una cuenta técnica
    interna. El efecto observable (acreditación exacta y única, con identidad
    txHash/logIndex visible en GET /deposits) se verifica en AT-02-04-08 y en
    los ATs de la épica 07. La estructura del asiento se evalúa
    white-box/rúbrica en H8.
  referencia: spec/02-balances-y-ledger/HU-02-03-libro-contable-de-movimientos.md

- at_id: AT-02-03-02
  motivo: >-
    La forma del asiento ORDER_LOCK (type, reference {orderId}, postings DEBIT
    available / CREDIT locked) no es observable sin superficie de ledger en el
    contrato de la épica 09. Su efecto sobre los buckets (available −= x,
    locked += x, total constante) se verifica black-box en AT-02-02-01/02/03.
    Se evalúa white-box/rúbrica en H8.
  referencia: spec/02-balances-y-ledger/HU-02-03-libro-contable-de-movimientos.md

- at_id: AT-02-03-03
  motivo: >-
    La forma del asiento ORDER_RELEASE (type, reference {orderId}, postings
    DEBIT locked / CREDIT available) no es observable sin superficie de ledger
    en el contrato de la épica 09. Su efecto sobre los buckets se verifica
    black-box en AT-02-02-05/06. Se evalúa white-box/rúbrica en H8.
  referencia: spec/02-balances-y-ledger/HU-02-03-libro-contable-de-movimientos.md

- at_id: AT-02-03-04
  motivo: >-
    La composición del asiento TRADE_FILL (un ÚNICO asiento con seis postings,
    sub-clasificación kind=FEE hacia EX, reference tradeId, balanceo por activo)
    no es observable sin superficie de ledger. Los seis montos, las fees y la
    conservación del fill sí se verifican black-box (balances + pata propia de
    GET /trades) en AT-02-02-08, AT-02-03-10 y AT-02-04-01. La unicidad y forma
    del asiento se evalúa white-box/rúbrica en H8.
  referencia: spec/02-balances-y-ledger/HU-02-03-libro-contable-de-movimientos.md

- at_id: AT-02-03-05
  motivo: >-
    Reconstruir balances sumando CREDIT − DEBIT por cuenta/activo/bucket y
    verificar el determinismo de reprocesar el ledger exige leer los asientos,
    sin superficie API en la épica 09. La proyección observable (los balances
    reportados coinciden exactamente con los que produce la secuencia normativa
    de asientos) se verifica en AT-02-01-07; la persistencia/reconstrucción tras
    reinicio, en AT-02-04-06. Se evalúa white-box en H8.
  referencia: spec/02-balances-y-ledger/HU-02-03-libro-contable-de-movimientos.md

- at_id: AT-02-03-06
  motivo: >-
    La corrección vía asiento de compensación (REVERSAL con postings inversos y
    reference {reversedEntryId}, original intacto) es un mecanismo interno del
    motor contable: el contrato de la épica 09 no expone ninguna operación que
    dispare una reversión ni una vía para observar asientos/entryId. Se evalúa
    white-box/rúbrica en H8.
  referencia: spec/02-balances-y-ledger/HU-02-03-libro-contable-de-movimientos.md

- at_id: AT-02-03-07
  motivo: >-
    "No se crea un segundo asiento DEPOSIT" es una propiedad del ledger, sin
    superficie API para contar asientos; tampoco hay vía black-box para forzar
    el reproceso del mismo evento on-chain (el reporte DEPOSIT_ALREADY_CREDITED
    es interno al pipeline de acreditación). El efecto observable (el balance se
    acredita una sola vez por identidad (txHash, logIndex), INV-5) se verifica
    en AT-02-04-08. Se evalúa white-box en H8.
  referencia: spec/02-balances-y-ledger/HU-02-03-libro-contable-de-movimientos.md

- at_id: AT-02-03-08
  motivo: >-
    El rechazo de un asiento desbalanceado es una validación interna del motor
    contable: no existe vía black-box para intentar escribir un asiento
    arbitrario (Σ CREDIT ≠ Σ DEBIT) a través del contrato de la épica 09. Se
    evalúa white-box (tests propios del SUT o inspección) en H8.
  referencia: spec/02-balances-y-ledger/HU-02-03-libro-contable-de-movimientos.md

- at_id: AT-02-03-09
  motivo: >-
    Requiere inyectar una falla después de persistir algunos postings y antes de
    completar el asiento (el mecanismo de inyección de AT-02-04-02): es
    infraestructura interna del SUT, sin superficie black-box para provocarla
    determinísticamente ni para observar asientos parciales. Se evalúa como test
    de integración white-box en H8.
  referencia: spec/02-balances-y-ledger/HU-02-03-libro-contable-de-movimientos.md

- at_id: AT-02-03-11
  motivo: >-
    Requiere inyectar una falla ENTRE la escritura del TRADE_FILL y la del
    ORDER_RELEASE de surplus dentro de la misma transacción (mecanismo de
    AT-02-04-02, interno al SUT). Sin esa inyección, la unidad atómica de los
    dos asientos no es falsable black-box. El efecto observable del camino feliz
    (consumo + liberación de surplus en la misma operación) se verifica en
    AT-02-02-07/13. Se evalúa como test de integración white-box en H8.
  referencia: spec/02-balances-y-ledger/HU-02-03-libro-contable-de-movimientos.md

# ---------------------------------------------------------------------------
# HU-02-04 — Atomicidad y consistencia
# ---------------------------------------------------------------------------

- at_id: AT-02-04-02
  motivo: >-
    El propio escenario declara el prerrequisito de infraestructura: un
    repositorio configurable que lanza una excepción tras persistir el N-ésimo
    posting (o una violación de constraint en el 4.º). Ese punto de inyección es
    interno a la implementación y el contrato HTTP/WS no ofrece forma de
    provocarlo ni de sincronizarlo. Se evalúa como test de integración
    white-box en H8.
  referencia: spec/02-balances-y-ledger/HU-02-04-atomicidad-y-consistencia.md

- at_id: AT-02-04-07
  motivo: >-
    La "caída" debe ocurrir mientras una transacción de balance está sin
    committear: desde afuera no se puede interrumpir el proceso en ese instante
    de forma determinista (matar el SUT al azar no garantiza la ventana). La
    parte observable de la recuperación (balances reconstruidos idénticos tras
    reinicio) se verifica en AT-02-04-06. Se evalúa white-box/inspección en H8.
  referencia: spec/02-balances-y-ledger/HU-02-04-atomicidad-y-consistencia.md

