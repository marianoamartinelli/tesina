# Plantilla de resultados del agente evaluador white-box — v1.2
# (ADR-007; conteo por ADR-011; modelo por ADR-010 D3; rubrica_version por ADR-013)
#
# Formato de salida OBLIGATORIO de cada pasada: un único YAML con este esquema,
# exactamente 56 items, en el orden de la rúbrica (ascendente por at_id).
# El humano lo archiva como runs/<id>/no-automatizables/pasada-<n>.yaml; tras
# arbitrar las dos pasadas firma veredicto-final.yaml con el mismo esquema de items.
# Estos veredictos alimentan sólo la fila `no_automatizado` del dataset (nunca se
# mezclan con los pasa/falla de la suite black-box).

metadatos:
  celda: "celda-en-evaluacion"   # ANONIMIZADA: el agente no sabe (ni intenta saber) qué celda es
  fecha:                          # AAAA-MM-DD de la pasada
  pasada:                         # 1 | 2 (dos sesiones frescas independientes por celda)
  modelo_evaluador: "claude-opus-5"     # ADR-007 §1, re-pinneado por ADR-010 Decisión 3
  briefing_version: "v1.1"        # versión de evaluacion/agente-evaluador/briefing.md usada
  rubrica_version: "v1.2"         # versión de evaluacion/agente-evaluador/rubrica-white-box.md usada

# Por item:
#   at_id         — ID estable del catálogo (no renombrar, no reordenar).
#   veredicto     — PASA | FALLA | NO_EVALUABLE (definiciones cerradas en briefing.md §4).
#   causa         — presente SOLO si veredicto = NO_EVALUABLE (tabla del briefing).
#   evidencia     — lista NO vacía de objetos { tipo, ref, detalle }:
#                     tipo: archivo  -> ref = ruta:líneas relativa a la copia de evaluación
#                     tipo: comando  -> ref = comando ejecutado; detalle = salida relevante recortada
#                     tipo: corpus   -> ref = corpus/documentos/<archivo> §sección citada
#                   Un veredicto sin evidencia es inválido (se trata como no emitido).
#   justificacion — 2 a 3 líneas conectando la evidencia con el criterio de la rúbrica.
#   duracion_min  — minutos dedicados al AT (tope: 15, briefing §5).
#
# Ejemplo de un item completo (ilustrativo; NO agregarlo al resultado):
#   - at_id: AT-06-01-02
#     veredicto: PASA
#     evidencia:
#       - { tipo: archivo, ref: "src/wallet/bip39.ts:41-58", detalle: "PBKDF2-HMAC-SHA512, 2048 iter, dkLen 64" }
#       - { tipo: comando, ref: "node /tmp/eval-wb/driver-kat.js", detalle: "seed=c55257c360c07c72...e7463b04" }
#       - { tipo: corpus, ref: "corpus/documentos/bip-0039.mediawiki §From mnemonic to seed", detalle: "parámetros del KDF" }
#     justificacion: >-
#       La seed derivada con el vector canónico y passphrase TREZOR coincide byte a
#       byte con la esperada por HU-06-01; parámetros del KDF conformes al corpus.
#     duracion_min: 9

