celda: pre-piloto-2a   # segunda corrida descartable (ADR-018; tras ADR-023..026); no cuenta para el 2x2 ni para H6
harness: a            # Claude Code CLI
modelo: claude-opus-5 # mismo pin que las celdas oficiales (ADR-009 D3)
effort: high              # la pre-piloto corre en `high`, no en el `xhigh` de las oficiales (ADR-018)
rag: true             # con RAG: la épica 06 del alcance es la que fuerza el uso del corpus
etapas: ../comun/etapas-prepiloto.yaml
