        detalle: "MAX_ADDRESS_INDEX=2^31-1; validateAddressIndex rechaza no-enteros, <0 y >MAX con WalletCryptoError VALIDATION_ERROR issues.field=address_index; se invoca al inicio de deriveEthereumKey, antes del HMAC."
      - tipo: archivo
        ref: "src/database.ts:53"
        detalle: "CHECK (address_index >= 0 AND address_index <= 2147483647)."
      - tipo: comando
        ref: "tsx --test test/wallet-crypto.test.ts  # 'acepta el último índice normal y rechaza índices hardened'"
        detalle: "2147483647 se acepta y deriva; 2147483648 lanza VALIDATION_ERROR con issues[0].field=address_index."
    justificacion: >-
      El borde no-hardened es exacto (2^31-1 pasa, 2^31 se rechaza con VALIDATION_ERROR y issues de
      address_index) antes de derivar.
    duracion_min: 5

