resultados:
  - at_id: AT-01-02-13
    veredicto: PASA
    evidencia:
      - tipo: archivo
        ref: "src/auth/service.ts:94-171"
        detalle: "login normaliza email, escribe auth_audit SUCCESS (reason null) o FAILURE/INVALID_CREDENTIALS; writeAudit persiste timestamp ISO, email, result, reason, origin."
      - tipo: archivo
        ref: "src/database.ts:38-45"
        detalle: "Tabla interna auth_audit (timestamp, email, result SUCCESS|FAILURE, reason, origin); no hay ruta que la exponga."
      - tipo: archivo
        ref: "src/app.ts:31-38"
        detalle: "KNOWN_ROUTES no incluye /audit ni /login-attempts."
      - tipo: comando
        ref: "curl POST /api/v1/auth/login ok+fail contra instancia :3415; SELECT timestamp,email,result,reason FROM auth_audit"
        detalle: "SUCCESS timestamp=2026-09-07T16:52:21.403Z email=audit.user@example.com (normalizado desde Audit.User@Example.COM); FAILURE reason=INVALID_CREDENTIALS. GET /api/v1/auth/audit|/api/v1/audit|/api/v1/logs -> 404 NOT_FOUND."
    justificacion: >-
      El log interno registra ambos intentos con timestamp UTC, email normalizado, result SUCCESS/FAILURE
      y reason=INVALID_CREDENTIALS en el fallido. Ningún endpoint de usuario expone el log.
    duracion_min: 8

  - at_id: AT-01-03-04
    veredicto: NO_EVALUABLE
    causa: FUNCION_NO_LOCALIZABLE
    evidencia:
      - tipo: archivo
        ref: "README.md:1-11"
        detalle: "Corrida pre-piloto etapa 3: backend con auth, wallet HD y deposit-address; sin trading, órdenes, balances, seguimiento de depósitos ni retiros."
      - tipo: archivo
        ref: "src/app.ts:31-38"
        detalle: "KNOWN_ROUTES solo /health, /api/v1/auth/register|login|logout, /api/v1/me y /api/v1/deposit-address; el resto de /api/v1 responde NOT_FOUND."
      - tipo: comando
        ref: "ls src && grep -rni 'ORDER_LOCK\\|orderbook\\|TRADE_FILL\\|DEPOSIT_NOT_CONFIRMED\\|BROADCAST\\|ledger' src --include='*.ts'"
        detalle: "src/ = app.ts auth/ config.ts database.ts errors.ts rate-limit.ts rpc*.ts server.ts wallet/ websocket.ts. El grep de módulos de épicas 02-05/07-08 solo halla un comentario en websocket.ts:115 (canales fuera de alcance)."
    justificacion: >-
      Épica/función fuera del subconjunto pre-piloto: no hay implementación evaluable y no se aplicó el
      procedimiento de la rúbrica.
    duracion_min: 0

