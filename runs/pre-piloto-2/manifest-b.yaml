  direccion_usdc_mock: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512 (bloque de despliegue 2)"
  version_anvil: "ghcr.io/foundry-rs/foundry@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46"

