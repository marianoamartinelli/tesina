  base: "sha256:72a1a49f631ba34cce602a8de55134e4d9b39e2047b0074b5eca5e8d06af11d5"
  agente_a: "sha256:af7f27b10893c31c6d856031d3a4226789f7703fc7abee8b809ffaf99be9e0e0"
