# Manifest de corrida — completar secciones 1-4 ANTES de iniciar; sección 5 al cierre.
#
# Estado al 2026-08-16: §1-2 completas; §3-4 con los campos que dependen del arranque
# marcados `PENDIENTE-ARRANQUE:` (cada uno lleva el comando o el paso que los completa).
# Mientras quede uno abierto, la precondición "Manifest" de la checklist H6 NO está
# cumplida. Ningún valor de este archivo es estimado: o sale de una fuente primaria del
# repo, o se midió en esta máquina, o es un placeholder explícito.

# 1. Identidad de la corrida
run_id: "piloto-01"
celda:
  modelo: "A (Claude)"
  rag: true                # con RAG para ejercitar también el servidor MCP stdio
oficial: false             # descartable: no cuenta para el 2×2

# 2. Insumos pinneados (deben ser idénticos entre las 4 corridas oficiales)
spec:
  tag: "spec-v1.1"           # re-freeze de ADR-006; spec-v1.0 quedó como tag histórico
  commit: "c00da9b8cfa79b663d67a03d8588429c6b7b6554"
corpus:                    # sólo celdas con RAG; null en sin-RAG
  commit: "0509b9f930a71ac09b796f557092936b96a6b45d"   # "corpus: curaduría y congelamiento del corpus RAG v1.0 (H3)"
  manifest: "corpus/manifest.md — v1.0, captura 2026-07-05, 9 documentos"
  sha256_manifest: "1c32723a2ff5c51a2947d3fbc50995c2981574b3b9335ad78917dfbfdaf3cb23"
  # Los SHA-256 por documento viven en la tabla de corpus/manifest.md; no se duplican acá.
  # verificar_paridad.py los recontrasta contra corpus/documentos/ en cada corrida:
  # 9/9 coincidentes en la verificación del 2026-08-16T19:08:07-0300 registrada abajo.
protocolo:
  adr: "ADR-016"           # protocolo v1.2 (ADR-016 reemplaza a ADR-012, que reemplazó a ADR-004): sin topes de presupuesto

# 3. Configuración del pipeline
pipeline_commit: "PENDIENTE-ARRANQUE: commitear la reescritura del pipeline a los CLI (ítem 17) y registrar acá ese hash. Hoy los orquestadores viven sólo en el working tree (17 rutas modificadas/sin trackear bajo pipeline/); el último commit que tocó pipeline/ (e1c4403e77b3e2486584bac06a9d0be8f462da65) NO los contiene."
paridad_verificada: "2026-08-23 — `.venv/bin/python pipeline/verificar_paridad.py` exit 0, 113 chequeos (77 antes de ADR-014/015), sobre el working tree SIN commitear. PENDIENTE-ARRANQUE: re-correrlo sobre el commit de pipeline/ una vez creado y reemplazar esta línea por timestamp + hash."
modelo:
  proveedor: "anthropic"
  model_id: "claude-opus-5"        # ADR-009 Decisión 3; coincide con pipeline/config/piloto-01.yaml
  parametros:
    effort: "xhigh"                # ADR-009 Decisión 3; coincide con pipeline/config/piloto-01.yaml
  # El resto de la invocación (flags de aislamiento, herramientas denegadas por ADR-008,
  # --forward-subagent-text, --mcp-config) queda pinneada por `pipeline_commit`:
  # harness_a/orquestar.py:construir_comando.
harness:
  # ADR-009 Decisión 1 retira los SDK de agentes: el harness de cada familia es el CLI de
  # su proveedor. Los campos `sdk`/`version` de la plantilla se reemplazan por estos.
  cli: "claude-code"                 # invocado como `claude -p --output-format stream-json`
  version: "PENDIENTE-ARRANQUE: `claude --version` al arrancar. El host tenía 2.1.233 el 2026-08-16 y 2.1.241 el 2026-08-23: el CLI se actualiza solo, así que la versión se mide al inicio de la corrida y es la que se pinnea en la imagen del contenedor (ADR-015)."
  auth: "PENDIENTE-ARRANQUE: verificar la sesión del CLI y registrar el modo (suscripción | API key). Lo verifica el tesista; el dato decide suscripción contra API key para las 4 oficiales (checklist H6, precondición «Autenticación»)."
versiones_cli:             # ambas se pinnean aunque piloto-01 sólo invoque el CLI de A (checklist H6, precondición «Versiones de CLI»)
  claude: "PENDIENTE-ARRANQUE: `claude --version` al arrancar (2.1.233 el 2026-08-16; 2.1.241 el 2026-08-23)"
  codex: "codex-cli 0.146.0"         # salida exacta de `codex --version`, 2026-08-16
entorno_host:              # toolchain del host del que dependen las 3 etapas; medido el 2026-08-16
  os: "macOS 26.5.2 (Darwin 25.5.0, arm64)"
  node: "v23.11.0"
  npm: "10.9.2"
  python: "Python 3.12.10 (.venv del repo)"
  docker: "Docker version 28.5.2, build ecc6942"   # versión del cliente; el daemon está caído
  foundry: "PENDIENTE-ARRANQUE: con el daemon de docker arriba, `docker compose -f evaluacion/suite-at/entorno/docker-compose.yml up -d --wait` y luego `docker exec suite-at-anvil anvil --version`."
entorno_onchain:           # entorno del smoke check de backend (anvil + USDC-mock)
  url_rpc: "http://127.0.0.1:8545"   # puerto publicado por evaluacion/suite-at/entorno/docker-compose.yml
  direccion_usdc_mock: "PENDIENTE-ARRANQUE: con el entorno arriba, `.venv/bin/python evaluacion/suite-at/entorno/desplegar-usdc.py` y registrar la dirección que imprime."
  version_anvil: "PENDIENTE-ARRANQUE (checklist H6, ítem 13): con el contenedor levantado, `docker inspect --format '{{index .RepoDigests 0}}' \"$(docker inspect --format '{{.Image}}' suite-at-anvil)\"` —inspecciona la imagen que el contenedor está corriendo, no el ref por el que se hizo pull— y comparar la salida contra el digest que pinnea el compose: sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46."
# Sin topes de presupuesto (ADR-016 / protocolo v1.2 §6): la corrida termina cuando
# termina el pipeline. Costo, tiempo, tokens y turnos se registran como variables
# dependientes —abajo, en §5— y no como umbrales. El bloque `presupuesto` de la plantilla
# se retira: no hay número que pinnear.

contenedores:              # ADR-015; digests efectivos, no tags (el tag es flotante)
  tag: "piloto-01"         # el mismo para las 3 imágenes y las 4 celdas
  base: "PENDIENTE-ARRANQUE: `docker build -f pipeline/contenedores/Dockerfile.base -t tesina/agente-base:piloto-01 pipeline/contenedores` y registrar `docker inspect --format '{{index .RepoDigests 0}}' tesina/agente-base:piloto-01` (o el Id local si no se pushea)."
  agente_a: "PENDIENTE-ARRANQUE: ídem con Dockerfile.a y --build-arg VERSION_CLI=<claude --version>."
  agente_b: "PENDIENTE-ARRANQUE: ídem con Dockerfile.b y --build-arg VERSION_CLI=<codex --version>. piloto-01 no invoca el CLI de B, pero la imagen se pinnea igual (misma base)."
  red: "abierta (ADR-015 Decisión 4). PENDIENTE-ARRANQUE: registrar durante la corrida qué hosts se tocan; ese dato decide si va una allowlist antes de H7."

# 4. Repo de la implementación generada
repo:
  url: "PENDIENTE-ARRANQUE: crear el repo satélite `tesina-run-piloto-01` (ADR-001) con la spec pinneada a spec-v1.1 como único contenido, fuera del árbol de la tesina (protocolo §3 paso 1)."
  commit_inicial: "PENDIENTE-ARRANQUE: hash del commit inicial del repo satélite, registrado al crearlo y antes de que el agente ejecute nada."

