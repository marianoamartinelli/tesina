        detalle: "EXITED code=1; stderr: {\"fatal\":{\"code\":\"VALIDATION_ERROR\",\"message\":\"Mnemonic BIP-39 invalido: mnemonic invalido: se esperaban 24 palabras (256 bits de entropia) y se recibieron 12\"}}."
      - tipo: comando
        ref: "node leer-db.js <inst I4>/exchange.db \"SELECT COUNT(*) FROM wallet_seed\""
        detalle: "{\"filas_wallet_seed\":0} -- no se adopto el mnemonic de 128 bits."
      - tipo: archivo
        ref: "src/wallet/hd.ts:100-101,216-222"
        detalle: "MNEMONIC_WORD_COUNT = 24 y validacion (a): words.length !== 24 => MnemonicValidationError, primer paso de validateMnemonic24 (antes de wordlist y checksum)."
    justificacion: >-
