  - at_id: AT-06-01-05
    veredicto: PASA
    evidencia:
      - tipo: comando
        ref: "node /tmp/eval-wb/drivers/verificar-constante.js  (script en $COPIA_TMP que implementa §\"Generating the mnemonic\" del corpus sobre el wordlist del corpus, con entropia 0x00 x32)"
        detalle: "wordlist words = 2048; MS = 24; MNEMONIC_24_VALIDO = \"abandon\" x23 + \"art\"; ultima palabra = art. Queda verificado que MNEMONIC_24_CHECKSUM_INVALIDO (= abandon x24) difiere solo en la ultima palabra y por lo tanto tiene checksum invalido."
      - tipo: archivo
        ref: "README.md:134; .env.example:38-44; src/core/config.ts:283; src/bootstrap.ts:42-47"
        detalle: "MECANISMO DE IMPORT HALLADO (busqueda unica de §\"Mecanismo de import del mnemonic\", cuyo resultado sirve tambien a AT-06-01-09/-10 y AT-06-03-07): variable de entorno WALLET_MNEMONIC, documentada en la tabla de variables del README y en .env.example, leida en loadConfig() y pasada por bootstrap() a provisionWallet({importedMnemonic})."
      - tipo: comando
        ref: "/tmp/eval-wb/lanzar.sh I3 3903 WALLET_ENCRYPTION_KEY=<clave> WALLET_MNEMONIC=\"abandon ... abandon\" (24 veces)  -- instancia descartable limpia, sin parchear el SUT"
        detalle: "EXITED code=1; stderr: {\"fatal\":{\"code\":\"VALIDATION_ERROR\",\"message\":\"Mnemonic BIP-39 invalido: mnemonic invalido: el checksum BIP-39 no verifica\"}}. Sin material secreto en el mensaje."
      - tipo: comando
        ref: "node leer-db.js <inst I3>/exchange.db \"SELECT COUNT(*) FROM wallet_seed\""
        detalle: "{\"filas_wallet_seed\":0} -- no se adopto ni persistio ningun seed."
      - tipo: archivo
        ref: "src/wallet/hd.ts:212-239; src/modules/wallet/seedStore.ts:149-159"
        detalle: "validateMnemonic24 paso (c): bip39ValidateMnemonic sobre el wordlist ingles; el fallo lanza MnemonicValidationError que el provisioning traduce a ProvisioningError('VALIDATION_ERROR') antes de cifrar o insertar nada."
      - tipo: corpus
        ref: "corpus/documentos/bip-0039.mediawiki §Generating the mnemonic"
        detalle: "\"A checksum is generated by taking the first ENT / 32 bits of its SHA256 hash\"; con ENT=256, CS=8 y MS=24."
    justificacion: >-
      Con el mecanismo de import hallado (WALLET_MNEMONIC), la instancia descartable arrancada con el mnemonic
      de checksum invalido aborto con exit code 1 y VALIDATION_ERROR en stderr, sin filtrar palabras del mnemonic
      y sin dejar ninguna fila en wallet_seed. La constante se verifico antes contra el algoritmo del corpus.
    duracion_min: 12

