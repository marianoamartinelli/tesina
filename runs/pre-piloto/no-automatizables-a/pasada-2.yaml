resultados:
  - at_id: AT-01-02-13
    veredicto: PASA
    evidencia:
      - tipo: archivo
        ref: "src/core/audit.ts:24-53"
        detalle: "AuditLog.record() inserta en auth_audit_log (timestamp, event, email, result, reason, origin). El comentario de cabecera (lineas 1-8) declara el log interno de RNE-9 y que nunca registra password, hash ni token."
      - tipo: archivo
        ref: "src/modules/accounts/service.ts:211-237"
        detalle: "login(): email = normalizeEmail(payload.email) (validation.ts: trim + toLowerCase). Camino fallido -> audit.record({event:'LOGIN', email, result:'FAILURE', reason:'INVALID_CREDENTIALS'}); camino exitoso -> result:'SUCCESS'. timestamp = nowIso() = new Date().toISOString() (UTC, core/time.ts:2-4)."
      - tipo: comando
        ref: "curl -s -X POST http://127.0.0.1:3901/api/v1/auth/login (uno exitoso y uno con password incorrecta)"
        detalle: "Exitoso: 200 con token. Fallido: HTTP 401 {\"error\":{\"code\":\"INVALID_CREDENTIALS\"}}."
      - tipo: comando
        ref: "node leer-db.js <inst>/exchange.db \"SELECT * FROM auth_audit_log WHERE event='LOGIN'\""
        detalle: "id=4 {timestamp:2026-08-24T15:49:42.807Z, event:LOGIN, email:a-eval@example.com, result:SUCCESS, reason:null}; id=5 {timestamp:2026-08-24T15:49:42.863Z, event:LOGIN, email:a-eval@example.com, result:FAILURE, reason:INVALID_CREDENTIALS}. Los dos intentos quedaron registrados con los cuatro campos."
      - tipo: archivo
        ref: "src/http/app.ts:31-37,253-467"
        detalle: "Mapa de rutas completo (ROUTE_METHODS + los 6 handlers): ninguna ruta publica ni autenticada de usuario lee auth_audit_log; el unico uso de `audit` en la capa HTTP es app.ts:303 (escritura del intento RATE_LIMITED). AuditLog.list() esta marcado como inspeccion interna, sin superficie HTTP."
    justificacion: >-
      Los dos intentos de login producidos contra la instancia quedaron persistidos en auth_audit_log con
      timestamp UTC, email normalizado, result SUCCESS/FAILURE y reason=INVALID_CREDENTIALS en el fallido.
      El mapa de rutas no expone ese log por ninguna via de usuario, de modo que se cumple el criterio cerrado.
    duracion_min: 7

