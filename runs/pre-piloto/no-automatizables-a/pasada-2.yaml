  - at_id: AT-06-01-01
    veredicto: PASA
    evidencia:
      - tipo: archivo
        ref: "src/wallet/hd.ts:97-101,186-188"
        detalle: "MNEMONIC_ENTROPY_BITS = 256 y MNEMONIC_WORD_COUNT = 24; generateMnemonic24() delega en bip39GenerateMnemonic(ENGLISH_WORDLIST, 256)."
      - tipo: archivo
        ref: "node_modules/@scure/bip39/index.js:72-76"
        detalle: "generateMnemonic(wordlist, strength) => entropyToMnemonic(randomBytes(strength/8), wordlist): con strength=256 son 32 bytes de entropia. La cadena sigue en @noble/hashes/utils.js:303-311 -> crypto.getRandomValues (CSPRNG del entorno, @noble/hashes/crypto.js: globalThis.crypto), con fallback a node:crypto.randomBytes. No hay Math.random ni PRNG sembrado."
      - tipo: comando
        ref: "grep -rn \"Math.random|seedrandom|mulberry|xorshift\" sut/src/"
        detalle: "Sin hallazgos en el codigo propio."
      - tipo: comando
        ref: "node /tmp/eval-wb/drivers/kat-generacion.js"
        detalle: "palabras(a)=24 | palabras(b)=24; checksum/wordlist validos: true true; a !== b: true."
      - tipo: archivo
        ref: "src/wallet/hd.ts:117-119,250-259"
        detalle: "PBKDF2_ITERATIONS=2048, SEED_BYTES=64; mnemonicToSeed(mnemonic, passphrase='') => noblePbkdf2(sha512, utf8(mnemonic NFKD), utf8('mnemonic' + passphrase NFKD), {c:2048, dkLen:64}). Passphrase vacia por defecto (y config.ts:284: WALLET_MNEMONIC_PASSPHRASE ?? '')."
      - tipo: archivo
        ref: "src/modules/wallet/seedStore.ts:27-28,45-71"
        detalle: "NONCE_BYTES=12 (96 bits) y TAG_BYTES=16 (128 bits). encryptPayload: nonce = randomBytes(12) por operacion, createCipheriv('aes-256-gcm', key, nonce), formato nonce||ciphertext||tag. decryptPayload: setAuthTag + final() -> el tag se verifica al descifrar."
      - tipo: archivo
        ref: "src/core/config.ts:112-127,282; src/db/index.ts:45-49"
        detalle: "decodeEncryptionKey exige 32 bytes y la credencial sale de env.WALLET_ENCRYPTION_KEY; no esta hardcodeada. La tabla wallet_seed guarda solo (id, payload, created_at): la clave no se persiste junto al blob."
      - tipo: corpus
        ref: "corpus/documentos/bip-0039.mediawiki §From mnemonic to seed"
        detalle: "\"we use the PBKDF2 function with a mnemonic sentence (in UTF-8 NFKD) used as the password and the string 'mnemonic' + passphrase ... used as the salt. The iteration count is set to 2048 and HMAC-SHA512 is used ... The length of the derived key is 512 bits (= 64 bytes).\" Coincide con la implementacion."
      - tipo: corpus
        ref: "corpus/documentos/bip-0039.mediawiki §Generating the mnemonic"
        detalle: "Tabla ENT/CS/MS: ENT=256 => CS=8 => MS=24 palabras, consistente con los 32 bytes de entropia y las 24 palabras observadas."
    justificacion: >-
      Los cuatro puntos se verifican: entropia de 256 bits del CSPRNG del entorno con mnemonic de 24 palabras y
      checksum valido, PBKDF2-HMAC-SHA512 con 2048 iteraciones y dkLen 64 con passphrase vacia por defecto, y
      seed cifrado en reposo con AES-256-GCM (nonce de 96 bits por operacion, tag de 128 bits verificado) usando
      una credencial tomada del entorno que no se persiste junto al material cifrado.
    duracion_min: 11

  - at_id: AT-06-01-02
    veredicto: PASA
    evidencia:
      - tipo: archivo
        ref: "src/wallet/hd.ts:250-259"
        detalle: "Funcion interna mnemonic->seed del SUT: mnemonicToSeed(mnemonic, passphrase)."
      - tipo: comando
        ref: "node /tmp/eval-wb/drivers/kat-seed.js trezor  (driver en $COPIA_TMP que invoca dist/src/wallet/hd.js con MNEMONIC_BIP39_CANONICO y passphrase \"TREZOR\")"
        detalle: "Salida: c55257c360c07c72029aebc1b53c05ed0362ada38ead3e3e9efa3708e53495531f09a6987599d18264c1e1c92f2cf141630c7a3c4ab7c81b2f001698e7463b04"
      - tipo: archivo
        ref: "spec/06-wallet-hd-y-direcciones/HU-06-01-generacion-y-custodia-del-seed.md:131,151"
        detalle: "Valor esperado fijado por la spec: identico caracter a caracter al obtenido."
      - tipo: corpus
        ref: "corpus/documentos/bip-0039.mediawiki §From mnemonic to seed"
        detalle: "Referencia normativa del algoritmo (PBKDF2-HMAC-SHA512, salt \"mnemonic\"+passphrase, 2048 iteraciones, 64 bytes)."
    justificacion: >-
      El driver invoco la funcion interna del SUT con el vector canonico y la passphrase TREZOR y devolvio
