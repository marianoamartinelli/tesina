        detalle: "Consulta interna GET /internal/deposit-addresses (no publica: exige X-Internal-Token o loopback) que devuelve wallet.listAll() -- todas las asignaciones con accountId, addressIndex, address, derivationPath, network y chainId. listEvents() expone ademas los eventos persistidos para lectura al arrancar."
      - tipo: archivo
        ref: "src/modules/accounts/service.ts:176-179,196"
        detalle: "Ausencia de ventana: la asignacion (y con ella el evento y la fila consultable internamente) ocurre en la transaccion del alta; ni el evento ni el endpoint interno dependen de la primera consulta del usuario."
