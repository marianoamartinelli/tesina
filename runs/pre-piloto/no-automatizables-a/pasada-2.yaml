      como exige la regla dura de la familia F2.
    duracion_min: 5

  - at_id: AT-06-01-03
    veredicto: PASA
    evidencia:
      - tipo: comando
        ref: "node /tmp/eval-wb/drivers/kat-seed.js m24 > seed-run1.txt   (invocacion 1 del proceso)"
        detalle: "408b285c123836004f4b8842c89324c1f01382450c0d439af345ba7fc49acf705489c6fc77dbd4e3dc1dd8cc6bc9f043db8ada1e243c4a0eafb290d399480840"
      - tipo: comando
        ref: "node /tmp/eval-wb/drivers/kat-seed.js m24 > seed-run2.txt   (invocacion 2, proceso separado)"
        detalle: "408b285c123836004f4b8842c89324c1f01382450c0d439af345ba7fc49acf705489c6fc77dbd4e3dc1dd8cc6bc9f043db8ada1e243c4a0eafb290d399480840"
