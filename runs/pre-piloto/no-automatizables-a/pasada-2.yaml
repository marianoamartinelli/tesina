  - at_id: AT-06-01-04
    veredicto: PASA
    evidencia:
      - tipo: comando
        ref: "/tmp/eval-wb/lanzar.sh I1 3901 WALLET_ENCRYPTION_KEY=<clave1>  (instancia descartable desde $COPIA_TMP, DATABASE_PATH propio y vacio, LOAD_DOTENV=false, provisioning por generacion)"
        detalle: "READY; registro de cuenta + GET /api/v1/deposit-address?asset=ETH -> address 0xC6EB1B5EA497979Cb82c7f719aF0d1fbFCC55Cdd, derivationPath m/44'/60'/0'/0/0."
