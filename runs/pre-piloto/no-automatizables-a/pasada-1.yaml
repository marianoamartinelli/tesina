  - at_id: AT-06-01-01
    veredicto: PASA
    evidencia:
      - { tipo: archivo, ref: "src/wallet/hd.ts:98-101,186-187", detalle: "MNEMONIC_ENTROPY_BITS=256, MNEMONIC_WORD_COUNT=24; generateMnemonic24() = bip39GenerateMnemonic(ENGLISH_WORDLIST, 256)" }
      - { tipo: archivo, ref: "node_modules/@scure/bip39/index.js:72-76 y node_modules/@noble/hashes/utils.js:303-312 y crypto.js:4 (dependencias instaladas en $COPIA_TMP con npm install; no vienen en la copia de evaluación)", detalle: "generateMnemonic(wordlist,256) => entropyToMnemonic(randomBytes(32)); randomBytes usa crypto.getRandomValues del entorno (CSPRNG). grep 'Math.random' sobre @scure y @noble: sin hallazgos" }
      - { tipo: archivo, ref: "src/wallet/hd.ts:118-119,250-258", detalle: "PBKDF2_ITERATIONS=2048, SEED_BYTES=64; mnemonicToSeed(mnemonic, passphrase='') = noblePbkdf2(sha512, NFKD(mnemonic), 'mnemonic'+NFKD(passphrase), {c:2048, dkLen:64}) — passphrase vacía por defecto" }
      - { tipo: archivo, ref: "src/modules/wallet/seedStore.ts:27-28,45-51,53-71", detalle: "AES-256-GCM: nonce = randomBytes(12) (96 bits) por cada operación de cifrado, tag de 16 bytes (128 bits), formato nonce||ciphertext||tag; al descifrar setAuthTag + verificación (falla => ProvisioningError INTERNAL_ERROR)" }
      - { tipo: archivo, ref: "src/core/config.ts:112-127,282 ; src/db/index.ts:44-49 ; .gitignore:4", detalle: "credencial leída de env.WALLET_ENCRYPTION_KEY y decodificada a 32 bytes; la tabla wallet_seed sólo guarda payload/created_at (la clave no se persiste con el blob); .env está en .gitignore, no embebido en el repositorio" }
      - { tipo: comando, ref: "grep -rn 'WALLET_ENCRYPTION_KEY' src/ ; grep -rnE '[0-9a-f]{64}' src/", detalle: "sólo lecturas de la variable y textos de error; ningún literal hexadecimal de 64 caracteres en el código (sin clave embebida)" }
      - { tipo: corpus, ref: "corpus/documentos/bip-0039.mediawiki §\"From mnemonic to seed\" (líneas 96-99) y §\"Generating the mnemonic\" (líneas 42-68)", detalle: "PBKDF2 con mnemonic NFKD como password, salt 'mnemonic'+passphrase, 2048 iteraciones, HMAC-SHA512, dkLen 512 bits; tabla ENT=256 => MS=24 palabras" }
    justificacion: >-
      Los cuatro puntos se cumplen: la entropía sale del CSPRNG del entorno
      (crypto.getRandomValues) con 256 bits, lo que produce 24 palabras; el KDF es
      PBKDF2-HMAC-SHA512 con 2048 iteraciones, dkLen 64 y passphrase vacía por defecto,
      conforme al corpus; y el seed se persiste cifrado con AES-256-GCM (nonce de 96 bits por
      operación, tag de 128 bits) con la credencial provista por el entorno y no embebida.
    duracion_min: 12

