      - { tipo: comando, ref: "npm install && npm run build en $COPIA_TMP (/tmp/eval-wb-p1/sut)", detalle: "toolchain del SUT: node v23.11.0; compilación sin errores (tsc -p tsconfig.json)" }
      - { tipo: corpus, ref: "corpus/documentos/bip-0039.mediawiki §\"From mnemonic to seed\" (líneas 96-99)", detalle: "referencia normativa del algoritmo PBKDF2/HMAC-SHA512/2048/64 bytes" }
