      - { tipo: archivo, ref: "src/services/auth-service.ts:132-143", detalle: "auditLoginAttempt() inserta timestamp ISO-8601 UTC (new Date().toISOString()), email normalizado (normalizeEmail: trim+lowercase, línea 138), result y reason" }
      - { tipo: archivo, ref: "src/app.ts:189-198", detalle: "hook onResponse audita TODA request a POST /api/v1/auth/login; el default es FAILURE, de modo que ningún desenlace queda sin registrar" }
      - { tipo: archivo, ref: "src/app.ts:150-187,252", detalle: "setErrorHandler fija loginAuditOutcome={FAILURE, reason: error.code} (INVALID_CREDENTIALS para credenciales inválidas); la línea 252 fija SUCCESS en el camino feliz" }
      - { tipo: comando, ref: "curl -s -X POST $EXCHANGE_API_URL/api/v1/auth/login -d '{\"email\":\"Audit.WB@Example.COM\",...}' (SUT principal en localhost:3103; un intento con contraseña correcta y otro con contraseña incorrecta)", detalle: "HTTP 200 con token; HTTP 401 {\"error\":{\"code\":\"INVALID_CREDENTIALS\"}}" }
      - { tipo: comando, ref: "docker exec sut-b node -e '...new DatabaseSync(\"/repo/data/exchange.sqlite\",{readOnly:true})...SELECT audit_id,timestamp,email,result,reason FROM auth_audit WHERE email=?' (lectura sólo lectura del almacenamiento del SUT vivo)", detalle: "2046 | 2026-08-24T14:35:25.704Z | audit.wb@example.com | SUCCESS | null ;; 2047 | 2026-08-24T14:35:25.757Z | audit.wb@example.com | FAILURE | INVALID_CREDENTIALS" }
      - { tipo: archivo, ref: "src/app.ts:38-45,209-325", detalle: "mapa de rutas completo (KNOWN_ROUTES + registros app.get/app.post): /health, /auth/register, /auth/login, /auth/logout, /me, /deposit-address; ninguna expone el log" }
      - { tipo: comando, ref: "grep -rn 'auth_audit' $COPIA_EVAL --exclude-dir=node_modules --exclude-dir=dist", detalle: "sólo src/database.ts:142 (DDL), src/services/auth-service.ts:140 (INSERT) y dos tests; ninguna lectura desde una ruta HTTP ni desde el WebSocket privado" }
    justificacion: >-
      Ambos intentos (exitoso y fallido) quedaron registrados con los cuatro campos exigidos:
      timestamp UTC ISO-8601, email normalizado a minúsculas, result SUCCESS/FAILURE y
      reason = INVALID_CREDENTIALS en el fallido. El log sólo se escribe: ninguna ruta de la
      API de usuario ni el canal WebSocket lo leen, por lo que se cumple el criterio cerrado.
    duracion_min: 12

