  - at_id: AT-06-01-04
    veredicto: PASA
    evidencia:
      - { tipo: comando, ref: "instancia descartable I1 desde $COPIA_TMP (puerto 3901, DATABASE_PATH=/tmp/eval-wb-p2/inst/I1/exchange.sqlite limpio, sin HD_MNEMONIC) + POST /api/v1/auth/register + GET /api/v1/deposit-address?asset=ETH", detalle: "{\"asset\":\"ETH\",\"address\":\"0xE5B5eae9B5Abc9126dB0227bAA4883C3f1bfA853\",\"network\":\"sepolia\",\"chainId\":\"11155111\"}" }
      - { tipo: comando, ref: "destrucción de I1 (kill + rm -rf de su almacenamiento) y arranque de la instancia descartable I2 (puerto 3902, almacenamiento limpio propio), mismo procedimiento", detalle: "{\"asset\":\"ETH\",\"address\":\"0x14d2740B2eE41b7AC14264FD6aec77793b881C06\",\"network\":\"sepolia\",\"chainId\":\"11155111\"}" }
      - { tipo: archivo, ref: "src/crypto/wallet.ts:165-168", detalle: "la entropía del provisioning es randomBytes(32) del CSPRNG; no hay valor fijo" }
    justificacion: >-
      Dos provisioning independientes, cada uno con almacenamiento limpio propio, producen
