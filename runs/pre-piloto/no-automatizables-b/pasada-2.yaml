      - { tipo: comando, ref: "node eval-drivers/verificar-constantes.mjs corpus/documentos/bip-0039-wordlist-english.txt", detalle: "MNEMONIC_24_VALIDO calculado desde la entropía 0x00×32 = abandon ×23 + art → coincide con la constante de la rúbrica (true)" }
      - { tipo: corpus, ref: "corpus/documentos/bip-0039.mediawiki §\"Generating the mnemonic\" (tabla ENT/CS/MS) y §\"From mnemonic to seed\"", detalle: "algoritmo usado para derivar y verificar la constante y el KDF" }
