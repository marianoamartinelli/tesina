      - { tipo: comando, ref: "npx tsx eval-drivers/driver-determinismo.ts (invocación 2, proceso separado, pid=83337)", detalle: "seed24=408b285c123836004f4b8842c89324c1f01382450c0d439af345ba7fc49acf705489c6fc77dbd4e3dc1dd8cc6bc9f043db8ada1e243c4a0eafb290d399480840" }
