      - { tipo: archivo, ref: "src/services/wallet-service.ts:89-108; src/database.ts:87-92", detalle: "MECANISMO (b) PRESENTE como consulta interna en proceso: listAssigned() → getAssignedAddresses() (conjunto completo de direcciones asignadas) y listAssignedEvents(); no se expone como endpoint HTTP" }
      - { tipo: comando, ref: "lectura sólo lectura de domain_events en la instancia descartable EAGER tras dos altas (sin consultar deposit-address)", detalle: "DepositAddressAssigned {\"accountId\":\"7947ffeb…\",\"addressIndex\":0,\"address\":\"0x615DB4B7692fdaB5f98d5319b9AB10067b733FE1\",\"chainId\":\"11155111\"} y el análogo para addressIndex 1 — emitidos en el alta, sin ventana respecto de la primera consulta del usuario" }
