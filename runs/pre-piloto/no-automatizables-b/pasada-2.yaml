    justificacion: >-
      El lado productor del contrato RN-11 está presente y verificado: el evento se emite con los
      cuatro campos dentro de la misma transacción que la asignación, y existe la consulta interna
      del conjunto asignado. El criterio cerrado exige además que el monitor de la épica 07 se
      alimente de él, y ese monitor no existe en la implementación, de modo que esa conjunción no
      es confirmable ni refutable (tampoco se observa la condición de FALLA: no hay descubrimiento
      con ventana). Se registra para arbitraje humano conforme a briefing §5.
