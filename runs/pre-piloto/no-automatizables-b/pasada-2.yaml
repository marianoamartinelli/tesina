  - at_id: AT-06-01-01
    veredicto: PASA
    evidencia:
      - { tipo: archivo, ref: "src/crypto/wallet.ts:165-168", detalle: "generateProjectSeed(): Mnemonic.fromEntropy(randomBytes(32), \"\", wordlists.en).phrase — CSPRNG del entorno (node:crypto randomBytes, importado en la línea 6), 32 bytes = 256 bits ⇒ 24 palabras del wordlist inglés" }
      - { tipo: comando, ref: "grep -rn 'Math.random|seedrandom|mulberry|xorshift' $COPIA_EVAL/src", detalle: "(sin hallazgos) — no hay PRNG sembrado ni Math.random en el código propio" }
      - { tipo: archivo, ref: "src/crypto/wallet.ts:138-140,153-163", detalle: "mnemonicToSeed(mnemonic, passphrase = \"\"): normaliza mnemonic y passphrase a NFKD y llama pbkdf2Sync(mnemonic, `mnemonic${passphrase}`, 2048, 64, \"sha512\") — passphrase por defecto vacía" }
      - { tipo: corpus, ref: "corpus/documentos/bip-0039.mediawiki §\"From mnemonic to seed\" (líneas 91-99) y §\"Generating the mnemonic\" (tabla ENT=256 ⇒ CS=8, MS=24)", detalle: "PBKDF2 con password = mnemonic NFKD, salt = \"mnemonic\"+passphrase NFKD, 2048 iteraciones, HMAC-SHA512, dkLen 512 bits; ENT 256 ⇒ 24 palabras" }
      - { tipo: comando, ref: "npx tsx eval-drivers/driver-generacion.ts <wordlist del corpus> (driver propio en $COPIA_TMP=/tmp/eval-wb-p2/sut, valida el checksum con un implementador independiente del SUT)", detalle: "gen1/gen2: palabras=24 seedBytes=64 checksum256bitsValido=true todasEnWordlist=true" }
      - { tipo: archivo, ref: "src/crypto/wallet.ts:175-191", detalle: "encryptSeed(): AES-256-GCM, clave de 32 bytes verificada, nonce randomBytes(12) generado por cada operación de cifrado, authTagLength 16, formato nonce||ciphertext||tag; decryptSeed() fija setAuthTag y falla si no verifica" }
      - { tipo: archivo, ref: "src/config.ts:35-44,93", detalle: "la credencial proviene sólo del entorno (WALLET_ENCRYPTION_KEY, hex o base64:), exige exactamente 32 bytes; no hay clave embebida" }
      - { tipo: archivo, ref: "src/database.ts:112-115,179-190", detalle: "el blob cifrado se persiste en wallet_metadata; la clave nunca se persiste junto al material cifrado" }
      - { tipo: comando, ref: "lectura del blob de una instancia descartable recién provisionada (node:sqlite readOnly sobre /tmp/eval-wb-p2/inst/CRED/exchange.sqlite)", detalle: "len=92 bytes = 12 (nonce) + 64 (seed cifrado) + 16 (tag), consistente con AES-256-GCM y seed de 64 bytes" }
    justificacion: >-
      Los cuatro puntos se verifican: entropía de 256 bits del CSPRNG del entorno con mnemonic
      de 24 palabras y checksum válido (comprobado con un validador independiente sobre el
      wordlist del corpus), PBKDF2-HMAC-SHA512/2048/64 con passphrase vacía por defecto sobre
      texto NFKD, y persistencia cifrada AES-256-GCM con nonce por operación, tag verificado y
      credencial tomada exclusivamente del entorno.
    duracion_min: 14

  - at_id: AT-06-01-02
    veredicto: PASA
    evidencia:
      - { tipo: archivo, ref: "src/crypto/wallet.ts:153-163", detalle: "función interna mnemonic→seed del SUT: mnemonicToSeed(mnemonic, passphrase)" }
      - { tipo: comando, ref: "npx tsx eval-drivers/driver-kat.ts (driver propio escrito en $COPIA_TMP=/tmp/eval-wb-p2/sut/eval-drivers/, importa src/crypto/wallet.js sin modificarlo)", detalle: "[AT-06-01-02] seed(CANONICO,'TREZOR') = c55257c360c07c72029aebc1b53c05ed0362ada38ead3e3e9efa3708e53495531f09a6987599d18264c1e1c92f2cf141630c7a3c4ab7c81b2f001698e7463b04" }
      - { tipo: corpus, ref: "corpus/documentos/bip-0039.mediawiki §\"From mnemonic to seed\" (líneas 96-99)", detalle: "referencia normativa del KDF: PBKDF2, password = mnemonic NFKD, salt = \"mnemonic\"+passphrase, 2048 iteraciones, HMAC-SHA512, 64 bytes" }
      - { tipo: comando, ref: "npx vitest run test/wallet.test.ts en $COPIA_TMP (F6 complementario; test propio en test/wallet.test.ts:33-37 con el valor esperado exacto de HU-06-01)", detalle: "13 tests passed (1 file)" }
    justificacion: >-
      El driver ejecutado contra la función interna del SUT con MNEMONIC_BIP39_CANONICO y
      passphrase \"TREZOR\" devuelve exactamente la seed hex fijada por HU-06-01 §Vector de
      prueba canónico, carácter a carácter. El KAT propio del SUT usa ese mismo valor esperado
      y pasa.
    duracion_min: 8

