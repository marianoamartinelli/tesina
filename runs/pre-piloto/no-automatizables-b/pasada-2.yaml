      - { tipo: comando, ref: "derivación de referencia EXTERNA al SUT: docker run -d --name anvil-ref --entrypoint anvil ghcr.io/foundry-rs/foundry:stable --mnemonic 'abandon … art' --accounts 4 ; docker logs anvil-ref ; docker rm -f anvil-ref", detalle: "(0) 0xF278cF59F82eDcf871d630F28EcC8056f25C1cdb ; (1) 0xf785bD075874b8423D3583728a981399f31e95aA ; (2) 0x60Af1c6A5D03F9f1B1b74931499bC99E72fF8DA9 ; (3) 0xDF7F9c4b9B9b9580B265DCD892173e9bD90e067F" }
