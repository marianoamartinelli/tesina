  - at_id: AT-01-02-13
    veredicto: PASA
    evidencia:
      - tipo: archivo
        ref: "src/database.ts:142-149"
        detalle: "Tabla auth_audit con columnas timestamp, email, result (CHECK IN ('SUCCESS','FAILURE')), reason y origin."
      - tipo: archivo
        ref: "src/services/auth-service.ts:132-143"
        detalle: "auditLoginAttempt() normaliza el email (normalizeEmail, lineas 37-39) e inserta new Date().toISOString() (UTC, sufijo Z) junto a result y reason."
      - tipo: archivo
        ref: "src/app.ts:189-198"
        detalle: "Hook onResponse: audita TODA request a POST /api/v1/auth/login. El camino exitoso marca SUCCESS (linea 252) y el manejador de errores marca FAILURE con reason = error.code (lineas 161-166); el default del hook es FAILURE/INTERNAL_ERROR."
      - tipo: comando
        ref: "curl -X POST $EXCHANGE_API_URL/api/v1/auth/login (un intento correcto y uno con password incorrecta, usuario Audit.User@Example.COM creado ad hoc)"
        detalle: "200 en el exitoso; 401 {'error':{'code':'INVALID_CREDENTIALS',...}} en el fallido."
      - tipo: comando
        ref: "node -e 'SELECT audit_id,timestamp,email,result,reason,origin FROM auth_audit' sobre la BD del SUT principal, en modo solo lectura"
        detalle: "Fila 1: 2026-08-24T14:19:05.348Z | audit.user@example.com | SUCCESS | reason=null. Fila 2: 2026-08-24T14:19:05.400Z | audit.user@example.com | FAILURE | reason=INVALID_CREDENTIALS. Email normalizado a minusculas en ambas."
      - tipo: archivo
        ref: "src/app.ts:38-45"
        detalle: "Mapa de rutas completo (6 rutas: register, login, logout, me, deposit-address, health); grep -rn 'auth_audit' sobre src/ solo devuelve database.ts:142 y auth-service.ts:140, ninguna ruta lee la tabla."
      - tipo: comando
        ref: "curl -o /dev/null -w '%{http_code}' sobre /api/v1/audit, /api/v1/auth/audit, /api/v1/me/audit, /api/v1/login-attempts, /api/v1/internal/audit"
        detalle: "404 en las cinco."
    justificacion: >-
      Los dos intentos quedaron registrados con los cuatro campos exigidos: timestamp UTC, email
      normalizado, result SUCCESS/FAILURE y reason = INVALID_CREDENTIALS en el fallido. El mapa de
      rutas no expone la tabla y las sondas a rutas plausibles de auditoria responden 404.
    duracion_min: 11

