  `pre-piloto-b`. Las tres etapas cerraron completas con sus tres smokes pasados.
  Evaluación: black-box 51 pasa / 3 falla / 2 skip —las 3 fallas son 404 de endpoints
  fuera del alcance (H-18), idénticas a las de B—; métricas estáticas por componente
  (backend 6533, web 1922, mobile 3575 loc), 2,3x el código de B para el mismo alcance.
  **Cero consultas al corpus** en las tres etapas (H-12), igual que B.
