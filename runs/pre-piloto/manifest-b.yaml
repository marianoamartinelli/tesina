# Manifest de la corrida PRE-PILOTO b (ADR-018) — descartable.
#
# No cuenta para el factorial 2×2 ni para la ventana H6: su objeto es verificar que
# todos los componentes del pipeline y de la evaluación corren de punta a punta sobre
# un universo reducido de la spec (ver matriz-componentes.md y
# evaluacion/pre-piloto/alcance.yaml). Los campos que sólo se pueden medir al arrancar
# o al cerrar quedan marcados PENDIENTE con el comando que los completa.

# 1. Identidad de la corrida
run_id: "pre-piloto-b"
celda:
  modelo: "B (GPT)"
  rag: true                # las dos celdas con RAG: el alcance incluye la épica 06,
                           # que es la que fuerza el uso del corpus (BIP-32/39/44)
oficial: false

# 2. Insumos pinneados
spec:
  tag: "spec-v1.1"
  commit: "c00da9b8cfa79b663d67a03d8588429c6b7b6554"   # spec-v1.1^{commit}
  alcance: "SUBCONJUNTO — no es la spec completa. HU-01-01, HU-01-02, épica 06 completa
    y la parte de la épica 09 que esas HU exponen (backend); HU-10-01 (web); HU-11-01 y
    la pantalla de depósito de HU-11-06 (mobile). Lo fijan los prompts de
    pipeline/comun/prompts/prepiloto/ y evaluacion/pre-piloto/alcance.yaml."
corpus:
  commit: "0509b9f930a71ac09b796f557092936b96a6b45d"
protocolo:
  adr: "ADR-016 (protocolo v1.2) + ADR-018 (esta corrida)"

# 3. Configuración del pipeline
