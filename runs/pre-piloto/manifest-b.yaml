nota_costo: >-
  Estimación local (el CLI de B informa tokens, no USD). Es una **cota superior**: la
  tarifa de entrada cacheada no está ratificada (ítem 20 de la checklist H6) y el
  estimador cobra los 49,2 M de tokens cacheados —el 96 % de la entrada— como entrada
  fresca. Con la caché a costo cero la cota inferior es ~USD 13. El número real está
  entre ambas y lo fija el dashboard del proveedor. Ver hallazgo H-14.
nota_tiempo: >-
  El tiempo de pared de la etapa backend **no es utilizable**: la máquina durmió unas 8
  horas durante la noche y congeló la corrida (hallazgo H-10). Las etapas web y mobile,
  corridas de día y con `caffeinate` activo, sí son representativas: 25 y 36 minutos
  para 3 invocaciones de rol cada una.
notas: >-
  Corrida descartable (ADR-018). Universo reducido: HU-01-01, HU-01-02, épica 06 completa
  y la parte de la épica 09 que esas HU exponen; HU-10-01 en web; HU-11-01 más la
  pantalla de depósito de HU-11-06 en mobile. `effort: high`, no `xhigh`. Las tres etapas
  cerraron completas, con sus tres smokes pasados.
  Evaluación: black-box 47 pasa / 7 falla / 2 skip sobre los 56 ATs con test del alcance
  —las 7 fallas son 404 de endpoints fuera del alcance, no defectos (H-18)—; white-box
  con dos pasadas validadas y concordancia 21/22; métricas estáticas de los tres
  componentes (backend 5301, web 1002, mobile 1422 loc, tras ADR-022).
  Los defectos de infraestructura que esta corrida encontró están en
  `runs/pre-piloto/hallazgos.md` (H-01 a H-20) y motivaron ADR-019 a ADR-022.
