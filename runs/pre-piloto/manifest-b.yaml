# Manifest de la corrida PRE-PILOTO b (ADR-018) — descartable.
#
# No cuenta para el factorial 2×2 ni para la ventana H6: su objeto es verificar que
# todos los componentes del pipeline y de la evaluación corren de punta a punta sobre
# un universo reducido de la spec (ver matriz-componentes.md y
# evaluacion/pre-piloto/alcance.yaml). Los campos que sólo se pueden medir al arrancar
# o al cerrar quedan marcados PENDIENTE con el comando que los completa.

